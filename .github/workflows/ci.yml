name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run the CUDA tests on a configured self-hosted GPU runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NINFER_PY_DEPS: >-
    pytest numpy safetensors tokenizers transformers pillow
    opencv-python-headless

jobs:
  python-tests:
    name: Python tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${NINFER_PY_DEPS} \
            'torch==2.7.1+cpu' 'torchvision==0.22.1+cpu' \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run Python suites
        run: |
          python -m pytest -q \
            tests/artifact \
            tests/targets/qwen3_6_27b \
            tests/targets/qwen3_6_35b_a3b \
            tests/targets/qwen3_8_27b \
            tests/test_bench_matrix.py \
            tests/test_serve_corpus.py

  cuda-build:
    name: CUDA 12.8 build (sm_86)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.28
        with:
          cuda: '12.8.1'
          method: network
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DBUILD_TESTING=ON
      - name: Build every product and test target
        run: cmake --build build -j

  gpu-tests:
    name: CUDA tests on GPU (sm_86)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the GPU and toolchain
        run: |
          nvidia-smi
          nvcc --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build -j
      - name: Run every C++/CUDA test
        run: ctest --test-dir build --output-on-failure
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${NINFER_PY_DEPS} \
            'torch==2.7.1+cpu' 'torchvision==0.22.1+cpu' \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run Python suites
        run: |
          python -m pytest -q \
            tests/artifact \
            tests/targets/qwen3_6_27b \
            tests/targets/qwen3_6_35b_a3b \
            tests/targets/qwen3_8_27b \
            tests/test_bench_matrix.py \
            tests/test_serve_corpus.py
      - name: Upload the CTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-gpu-sm86
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
